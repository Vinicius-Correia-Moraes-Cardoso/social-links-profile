<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social links profile</title>
    <link rel="icon" type="image/png" href="./images/favicon-32x32.png">
    <link rel="stylesheet" href="./images/style.css">
    <!-- font import-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <article class="social-media-container">
        <img class="profile-Picture"
        src="/images/avatar-jessica.jpeg" 
        alt="profile picture" height="75">
        <h2 class="author-name">Jessica Randall</h2>
        <p class="author-country">London, United Kingdom</p>
        <p>"Front-end developer and avid reader"</p>
        <ul class="social-media-list">
            <li><a class="social-media-link" target="_blank" href="https://github.com/">GitHub</a></li>
            <li><a class="social-media-link" target="_blank" href="https://www.frontendmentor.io">Frontend Mentor</a></li>
            <li><a class="social-media-link" target="_blank" href="https://www.linkedin.com/">Linkedin</a></li>
            <li><a class="social-media-link" target="_blank" href="https://x.com">Twitter</a></li>
            <li><a class="social-media-link" target="_blank" href="https://www.instagram.com/">Instagram</a></li>
        </ul>
    </article>
</body>
</html>
